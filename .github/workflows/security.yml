name: Security Gate

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  secret-scanning:
    name: Secret & SAST Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

      - name: Hardcoded Secrets SAST Regex
        run: |
          if grep -iREl 'service_role|SUPABASE_SERVICE_ROLE_KEY|password=***REDACTED*** src supabase/migrations; then
            echo "::error::Hardcoded critical secrets or identifiers found in the codebase!"
            exit 1
          fi
          echo "No hardcoded critical secrets found by basic SAST."

      - name: npm audit
        run: npm audit --audit-level=high
