name: OWASP ZAP Authorized Target

on:
  deployment_status:

permissions:
  contents: read

jobs:
  baseline:
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Preview'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate authorized target
        env:
          TARGET_URL: ${{ github.event.deployment_status.environment_url }}
        run: |
          if [[ "$TARGET_URL" == "https://zapnfe.vercel.app" ]] || [[ "$TARGET_URL" == "https://zapnfe.vercel.app/" ]]; then
            echo "URLs de produo no so permitidas no scan automatizado."
            exit 1
          fi
      - name: Prepare report directory
        run: |
          mkdir -p "${{ github.workspace }}/zap-reports"
          chmod 0777 "${{ github.workspace }}/zap-reports"
      - name: Run ZAP Baseline
        env:
          TARGET_URL: ${{ github.event.deployment_status.environment_url }}
        run: |
          docker run --rm \
            --volume "${{ github.workspace }}/zap-reports:/zap/wrk/:rw" \
            --network host \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t "$TARGET_URL" -T 5 -r zap-report.html -J zap-report.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-baseline-report
          path: |
            zap-reports/zap-report.html
            zap-reports/zap-report.json
          if-no-files-found: ignore

