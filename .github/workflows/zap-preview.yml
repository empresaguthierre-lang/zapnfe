name: OWASP ZAP Authorized Target

on:
  deployment_status:

permissions:
  contents: read

jobs:
  baseline:
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Preview'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate authorized Preview target
        env:
          TARGET_URL: ${{ github.event.deployment_status.environment_url }}
        shell: bash
        run: |
          set -euo pipefail
          case "$TARGET_URL" in
            https://zapnfe.vercel.app|https://zapnfe.vercel.app/)
              echo "Production targets are forbidden."
              exit 1
              ;;
            https://zapnfe-*.vercel.app|https://zapnfe-git-*.vercel.app)
              ;;
            *)
              echo "Target is not an authorized ZapNFe Preview URL."
              exit 1
              ;;
          esac

      - name: ZAP public baseline
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: ${{ github.event.deployment_status.environment_url }}
          rules_file_name: .zap/rules.conf
          allow_issue_writing: false
          fail_action: true
          artifact_name: zap-public-baseline
